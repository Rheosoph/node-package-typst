description = "Convert Flow-Like Markdown and compile Typst source into PDF or SVG documents"
id = "com.flow-like.typst"
keywords = [
    "typst",
    "pdf",
    "svg",
    "document",
    "template",
    "markdown",
    "charts",
]
license = "MIT"
manifest_version = 1
name = "Typst Documents"
repository = "https://github.com/flow-like/flow-like-typst-nodes"
version = "0.1.1"

[[authors]]
name = "Felix Schultz (Rheosoph GmbH)"

[[nodes]]
category = "Document/Typst"
description = "Compile Typst source text into PDF"
id = "typst_source_to_pdf"
name = "Typst Source to PDF"

[[nodes]]
category = "Document/Typst"
description = "Compile a Typst source file from FlowLike storage into PDF"
id = "typst_file_to_pdf"
name = "Typst File to PDF"

[[nodes]]
category = "Document/Typst"
description = "Compile a Typst source file from FlowLike storage into SVG"
id = "typst_file_to_svg"
name = "Typst File to SVG"

[[nodes]]
category = "Document/Typst"
description = "Compile Typst source text into SVG"
id = "typst_source_to_svg"
name = "Typst Source to SVG"

[[nodes]]
category = "Document/Typst"
description = "Compile Typst source text once into PDF and SVG"
id = "typst_source_to_pdf_svg"
name = "Typst Source to PDF + SVG"

[[nodes]]
category = "Document/Typst"
description = "Compile a Typst source file once into PDF and SVG"
id = "typst_file_to_pdf_svg"
name = "Typst File to PDF + SVG"

[[nodes]]
category = "Document/Typst"
description = "Convert Flow-Like Markdown into a safe Typst body fragment with static chart support"
id = "typst_markdown_to_typst"
name = "Markdown to Typst"

[[nodes]]
category = "Document/Typst"
description = "Apply an optional imported Typst template function to source text and write PDF"
id = "typst_template_to_pdf"
name = "Typst Source with Template to PDF"

[[nodes]]
category = "Document/Typst"
description = "Apply an optional imported Typst template function to a source file and write PDF"
id = "typst_template_file_to_pdf"
name = "Typst File with Template to PDF"

[[nodes]]
category = "Document/Typst"
description = "Apply an optional imported Typst template function to source text and write SVG"
id = "typst_template_to_svg"
name = "Typst Source with Template to SVG"

[[nodes]]
category = "Document/Typst"
description = "Apply an optional imported Typst template function to a source file and write SVG"
id = "typst_template_file_to_svg"
name = "Typst File with Template to SVG"

[[nodes]]
category = "Document/Typst"
description = "Apply an optional imported Typst template function to source text and write PDF and SVG"
id = "typst_template_to_pdf_svg"
name = "Typst Source with Template to PDF + SVG"

[[nodes]]
category = "Document/Typst"
description = "Apply an optional imported Typst template function to a source file and write PDF and SVG"
id = "typst_template_file_to_pdf_svg"
name = "Typst File with Template to PDF + SVG"

[[nodes]]
category = "Document/Typst"
description = "Validate Typst source text and return diagnostics metadata"
id = "typst_validate_source"
name = "Validate Typst Source"

[[nodes]]
category = "Document/Typst"
description = "Validate a Typst source file and return diagnostics metadata"
id = "typst_validate_file"
name = "Validate Typst File"

# Resource limits for the package sandbox (memory & timeout).
# Permissions are declared per-node in Rust code via `node.add_permission(NodePermission::*)`.
[permissions]
memory = "heavy"
timeout = "extended"
